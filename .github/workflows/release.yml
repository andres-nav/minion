name: release

# Tests and the release build run on pull requests and on main; only a tag or
# a manual dispatch publishes a release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: minion (go test, go vet)
        run: nix develop --command make -C minion test

      - name: runner (cargo test, cargo clippy)
        run: nix develop --command sh -c 'cd runner && cargo test && cargo clippy --all-targets -- -D warnings'

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history + tags so the Makefile's `git describe` sees the tag

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build (nix dev shell → make)
        run: |
          set -eu
          # Toolchain (go/make/git) comes from flake.nix; the Makefile injects
          # VERSION from `git describe` via -ldflags. CGO off → static, pure-Go
          # cross-compiles cleanly from the Linux runner.
          #
          # Linux agent binaries minion bootstraps onto remotes (minion/bin/minion-linux-*).
          nix develop --command make -C minion cross
          # Host binary for this matrix platform (minion/bin/minion).
          nix develop --command env \
            GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' CGO_ENABLED=0 \
            make -C minion build

      - name: Package
        run: |
          set -eu
          archive="minion-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -C minion/bin -czf "$archive" minion minion-linux-amd64 minion-linux-arm64
          echo "packaged → $archive"

      - uses: actions/upload-artifact@v4
        with:
          name: minion-${{ matrix.goos }}-${{ matrix.goarch }}
          path: minion-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > checksums.txt

      - name: Create release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" *.tar.gz checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
