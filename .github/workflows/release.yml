name: release

# Tests and the release build run on pull requests and on main; only a tag or
# a manual dispatch (of an existing tag) publishes a release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }} # a dispatch tests and builds the tag it releases
          fetch-depth: 0 # tags, so the Makefile's `git describe` sees the version

      - uses: cachix/install-nix-action@v30

      # Unit tests, lints and e2e, then the archives: every platform cross-compiles
      # from Linux, and each holds gru for its platform and the Linux agents and minion.
      - name: Test and package
        run: nix develop --command make test e2e dist

      - uses: actions/upload-artifact@v4
        with:
          name: gru
          path: dist/gru-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          sha256sum *.tar.gz > checksums.txt
          gh release create "$TAG" *.tar.gz checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
